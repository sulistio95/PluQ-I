name: PHP quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, curl, pdo_mysql
          coverage: none
      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find app bin config public tests -type f -name '*.php' -print0)
      - name: Test Duitku callback state mapping
        run: php tests/duitku-callback-result-state.php
      - name: Test checkout request fingerprint
        run: php tests/checkout-request-fingerprint.php
      - name: Test supplier account and response mapping
        run: php tests/fulfillment-mapping.php
