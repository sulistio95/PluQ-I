name: PHP quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_DATABASE: pluqi_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, curl, pdo_mysql
          coverage: none
      - name: Set up Node.js for JavaScript syntax validation
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check storefront JavaScript syntax
        run: node --check public/assets/catalog.js
      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find app bin config public tests -type f -name '*.php' -print0)
      - name: Test Duitku callback state mapping
        run: php tests/duitku-callback-result-state.php
      - name: Test Duitku transaction status response validation
        run: php tests/duitku-transaction-status.php
      - name: Test admin Duitku cooldown regression guard
        run: php tests/reconcile-cooldown-regression.php
      - name: Test checkout request fingerprint
        run: php tests/checkout-request-fingerprint.php
      - name: Test supplier account and response mapping
        run: php tests/fulfillment-mapping.php
      - name: Test automatically generated game account fields
        run: php tests/game-account-schema.php
      - name: Test VIPayment nickname lookup parameters
        run: php tests/game-username-vipayment.php
      - name: Test provider budget capacity boundaries
        run: php tests/provider-budget-capacity.php
      - name: Test customer catalog supplier availability filtering
        run: php tests/catalog-availability.php
      - name: Test admin supplier price filtering and pagination
        run: php tests/supplier-prices-pagination.php
      - name: Test supplier price queries against isolated MySQL
        env:
          TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=pluqi_test;charset=utf8mb4
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: test-root-password
        run: php tests/supplier-prices-mysql-integration.php
      - name: Test hybrid fixed and percentage pricing
        run: php tests/pricing-hybrid.php
      - name: Test admin authorization roles
        run: php tests/admin-authorization.php
      - name: Test admin login throttle cleanup scope
        run: php tests/admin-login-throttle-clear.php
      - name: Test customer order rating rules
        run: php tests/order-rating-rules.php
      - name: Test customer order rating CSRF validation
        run: php tests/order-rating-csrf.php
