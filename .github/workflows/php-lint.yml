name: PHP syntax checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, curl, openssl, mbstring, fileinfo
          coverage: none
      - name: Lint PHP files
        run: |
          set -eu
          find app bin config public -type f -name '*.php' -print0 | xargs -0 -n1 php -l
