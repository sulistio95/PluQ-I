name: Fulfillment safety tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, integration/pre-main-2026-10]

jobs:
  php-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, curl, openssl, mbstring, fileinfo
          coverage: none
      - name: Lint PHP files
        run: |
          set -eu
          find app bin config public tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Test pricing
        run: php tests/pricing_test.php
      - name: Test catalog sync helpers
        run: php tests/catalog_sync_test.php
      - name: Test Duitku callback signatures
        run: php tests/duitku_callback_test.php
      - name: Test account field mapping
        run: php tests/fulfillment_account_test.php
      - name: Test checkout payment gate
        run: php tests/checkout_gate_test.php
      - name: Test supplier response mapping
        run: php tests/provider_response_mapping_test.php
      - name: Test supplier retry safety
        run: php tests/fulfillment-retry-safety-test.php
      - name: Test Digiflazz balance validation
        run: php tests/digiflazz-balance-validation-test.php
      - name: Test VIPayment balance validation
        run: php tests/vipayment-balance-validation-test.php

  mysql-callback-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_DATABASE: pluq_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: pluq_test
      DB_USERNAME: root
      DB_PASSWORD: test-root-password
      DUITKU_ENV: sandbox
      DUITKU_MERCHANT_CODE: TESTMERCHANT
      DUITKU_API_KEY: integration-test-key
      DUITKU_PAYMENT_METHOD: VC
      DUITKU_CALLBACK_URL: https://example.test/duitku-callback.php
      DUITKU_RETURN_URL: https://example.test/order-status.php
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, curl, openssl, mbstring, fileinfo
          coverage: none
      - name: Apply schema and migrations
        run: |
          set -eu
          for sql in database/schema.mysql.sql database/migrations/002_catalog_and_operations.sql database/migrations/003_checkout_payment.sql database/migrations/004_supplier_manual_review_status.sql database/migrations/005_order_manual_review_status.sql database/migrations/006_monthly_settlements.sql database/migrations/007_admin_drive_folder_setting.sql database/migrations/008_admin_login_rate_limit.sql database/migrations/009_refund_order_latest_index.sql database/migrations/010_checkout_payload_fingerprint.sql database/migrations/011_provider_budget_reservations.sql database/migrations/012_pricing_rules_hybrid.sql database/migrations/013_game_username_check_protection.sql database/migrations/014_order_ratings_and_supplier_quality.sql; do
            mysql -h "$DB_HOST" -P "$DB_PORT" -u"$DB_USERNAME" -p"$DB_PASSWORD" "$DB_DATABASE" < "$sql"
          done
      - name: Test customer rating insert and duplicate rejection against MySQL
        run: |
          set -eu
          mysql -h "$DB_HOST" -P "$DB_PORT" -u"$DB_USERNAME" -p"$DB_PASSWORD" "$DB_DATABASE" <<'SQL'
          INSERT INTO games (slug, name, status)
          VALUES ('rating-integration-game', 'Rating Integration Game', 'ACTIVE');
          INSERT INTO products (game_id, provider_id, provider_product_code, name, base_price, selling_price, status)
          SELECT g.id, pr.id, 'rating-integration-sku', 'Rating Integration Product', 1000, 1500, 'ACTIVE'
          FROM games g JOIN providers pr ON pr.code = 'DIGI'
          WHERE g.slug = 'rating-integration-game';
          INSERT INTO orders (public_id, game_id, product_id, provider_id, customer_game_data, base_price, selling_price, admin_fee, payment_status, order_status)
          SELECT 'RATING20261027abcdef123456', g.id, p.id, p.provider_id, JSON_OBJECT('user_id','rating-test'), 1000, 1500, 1000, 'PAID', 'SUCCESS'
          FROM games g JOIN products p ON p.game_id = g.id
          WHERE g.slug = 'rating-integration-game' AND p.provider_product_code = 'rating-integration-sku';
          INSERT INTO order_ratings (order_id, provider_id, game_id, order_status_at_rating, rating, reason, comment)
          SELECT o.id, o.provider_id, o.game_id, o.order_status, 5, 'FAST_AND_SMOOTH', 'integration test'
          FROM orders o WHERE o.public_id = 'RATING20261027abcdef123456';
          SQL
          if mysql -h "$DB_HOST" -P "$DB_PORT" -u"$DB_USERNAME" -p"$DB_PASSWORD" "$DB_DATABASE" <<'SQL'
          INSERT INTO order_ratings (order_id, provider_id, game_id, order_status_at_rating, rating, reason, comment)
          SELECT o.id, o.provider_id, o.game_id, o.order_status, 4, 'OTHER', 'duplicate integration test'
          FROM orders o WHERE o.public_id = 'RATING20261027abcdef123456';
          SQL
          then
            echo "FAIL: duplicate rating for the same order was accepted"
            exit 1
          else
            echo "PASS: duplicate rating rejected by database unique constraint"
          fi
      - name: Test provider budget capacity, idempotency, concurrency, and stale-balance boundary against MySQL
        run: php tests/provider-budget-reservation-mysql-integration.php
      - name: Stress concurrent checkout idempotency and verify deadlock recovery with mocked Duitku
        run: |
          set -eu
          for attempt in 1 2 3; do
            echo "Concurrent checkout integration attempt ${attempt}/3"
            php tests/checkout-idempotency-concurrency-integration.php
          done
      - name: Test real MySQL deadlock classification for checkout recovery
        run: php tests/checkout-deadlock-classification-integration.php
      - name: Create disposable paid-callback fixture
        run: |
          mysql -h "$DB_HOST" -P "$DB_PORT" -u"$DB_USERNAME" -p"$DB_PASSWORD" "$DB_DATABASE" <<'SQL'
          INSERT INTO games (slug, name, status) VALUES ('integration-game', 'Integration Game', 'ACTIVE');
          INSERT INTO products (game_id, provider_id, provider_product_code, name, base_price, selling_price, status)
          SELECT g.id, pr.id, 'integration-sku', 'Integration Product', 1000, 1500, 'ACTIVE'
          FROM games g JOIN providers pr ON pr.code = 'DIGI' WHERE g.slug = 'integration-game';
          INSERT INTO orders (public_id, game_id, product_id, provider_id, customer_game_data, base_price, selling_price, admin_fee, payment_status, order_status)
          SELECT 'cafebabefeedface0123456789', g.id, p.id, p.provider_id, JSON_OBJECT('user_id','123'), 1000, 1500, 1000, 'PENDING', 'PENDING'
          FROM games g JOIN products p ON p.game_id = g.id WHERE g.slug = 'integration-game' AND p.provider_product_code = 'integration-sku';
          INSERT INTO payment_transactions (order_id, gateway, merchant_order_id, amount, status)
          SELECT id, 'DUITKU', public_id, 2500, 'PENDING' FROM orders WHERE public_id = 'cafebabefeedface0123456789';
          INSERT INTO orders (public_id, game_id, product_id, provider_id, customer_game_data, base_price, selling_price, admin_fee, payment_status, order_status)
          SELECT 'fedcba9876543210fedcba9876', g.id, p.id, p.provider_id, JSON_OBJECT('user_id','789'), 1000, 1500, 1000, 'PENDING', 'PENDING'
          FROM games g JOIN products p ON p.game_id = g.id WHERE g.slug = 'integration-game' AND p.provider_product_code = 'integration-sku';
          INSERT INTO payment_transactions (order_id, gateway, merchant_order_id, amount, status)
          SELECT id, 'DUITKU', public_id, 2500, 'PENDING' FROM orders WHERE public_id = 'fedcba9876543210fedcba9876';
          SQL
      - name: Test concurrent Duitku reconciliation admission against MySQL
        run: |
          set -eu
          for attempt in 1 2 3; do
            echo "Concurrent reconciliation admission attempt ${attempt}/3"
            php tests/reconcile-cooldown-concurrency-integration.php
          done
      - name: Start local PHP callback server
        run: |
          php -S 127.0.0.1:8080 -t public >/tmp/pluq-php-server.log 2>&1 &
          for i in $(seq 1 30); do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/duitku-callback.php || true)"
            if [ "$code" = "405" ]; then exit 0; fi
            sleep 1
          done
          cat /tmp/pluq-php-server.log
          exit 1
      - name: Test admin reconciliation HTTP security boundary
        run: php tests/reconcile-admin-http-integration.php
      - name: Test duplicate queue job during active supplier request
        run: php tests/duplicate-queue-processing-integration.php
      - name: Test concurrent queue claims against MySQL
        run: php tests/queue-worker-concurrency-integration.php
      - name: Test duplicate concurrent callbacks against MySQL
        run: bash tests/duitku_callback_integration.sh
      - name: Create isolated sandbox-only callback fixture
        run: |
          set -eu
          mysql -h "$DB_HOST" -P "$DB_PORT" -u"$DB_USERNAME" -p"$DB_PASSWORD" "$DB_DATABASE" <<'SQL'
          INSERT INTO orders (public_id, game_id, product_id, provider_id, customer_game_data, base_price, selling_price, admin_fee, payment_status, order_status)
          SELECT '0123456789abcdef0123456789', g.id, p.id, p.provider_id, JSON_OBJECT('user_id','sandbox-user'), 1000, 1500, 1000, 'PENDING', 'PENDING'
          FROM games g JOIN products p ON p.game_id = g.id
          WHERE g.slug = 'integration-game' AND p.provider_product_code = 'integration-sku';
          INSERT INTO payment_transactions (order_id, gateway, merchant_order_id, amount, status)
          SELECT id, 'DUITKU', public_id, 2500, 'PENDING'
          FROM orders WHERE public_id = '0123456789abcdef0123456789';
          SQL
      - name: Restart callback server in isolated sandbox-only mode
        run: |
          set -eu
          pkill -f '[p]hp -S 127.0.0.1:8080' || true
          APP_ENV=staging CHECKOUT_PAYMENTS_ENABLED=true SUPPLIER_ORDERS_ENABLED=false DUITKU_ENV=sandbox \
            php -S 127.0.0.1:8080 -t public >/tmp/pluq-php-sandbox-server.log 2>&1 &
          for i in $(seq 1 30); do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/duitku-callback.php || true)"
            if [ "$code" = "405" ]; then exit 0; fi
            sleep 1
          done
          cat /tmp/pluq-php-sandbox-server.log
          exit 1
      - name: Verify sandbox payment never queues supplier fulfillment
        env:
          APP_ENV: staging
          CHECKOUT_PAYMENTS_ENABLED: 'true'
          SUPPLIER_ORDERS_ENABLED: 'false'
        run: bash tests/duitku_sandbox_no_fulfillment_integration.sh
      - name: Test stale queue recovery against MySQL
        env:
          PLUQI_ALLOW_DESTRUCTIVE_QUEUE_RECOVERY_TEST: '1'
        run: bash tests/queue_recovery_integration.sh
      - name: Test worker finalization after lease revocation
        run: php tests/worker-lease-revocation-integration.php
      - name: Test ambiguous supplier outcome handling against MySQL
        run: bash tests/uncertain_supplier_integration.sh
      - name: Test explicit supplier rejection and refund state against MySQL
        run: bash tests/explicit_supplier_failure_integration.sh
      - name: Verify unresolved Duitku checkout appears in read-only review report
        run: |
          set -eu
          mysql -h "$DB_HOST" -P "$DB_PORT" -u"$DB_USERNAME" -p"$DB_PASSWORD" "$DB_DATABASE" <<'SQL'
          INSERT INTO orders (public_id, game_id, product_id, provider_id, customer_game_data, base_price, selling_price, admin_fee, payment_status, order_status, last_error)
          SELECT 'reviewcheckout012345678901', g.id, p.id, p.provider_id, JSON_OBJECT('user_id','456'), 1000, 1500, 1000, 'PENDING', 'PENDING', 'Duitku sandbox request needs manual review'
          FROM games g JOIN products p ON p.game_id = g.id
          WHERE g.slug = 'integration-game' AND p.provider_product_code = 'integration-sku';
          INSERT INTO payment_transactions (order_id, gateway, merchant_order_id, amount, status)
          SELECT id, 'DUITKU', public_id, 2500, 'PENDING'
          FROM orders WHERE public_id = 'reviewcheckout012345678901';
          SQL
          php bin/inspect-review.php > /tmp/pluq-review-report.json
          grep -q 'reviewcheckout012345678901' /tmp/pluq-review-report.json
          grep -q 'Duitku sandbox request needs manual review' /tmp/pluq-review-report.json
